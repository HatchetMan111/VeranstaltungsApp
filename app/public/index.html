<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Event-Karte</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#c9822b">
</head>
<body>
  <header id="header">
    <img id="event-logo" alt="" hidden>
    <h1 id="event-title">Lädt…</h1>
  </header>

  <main>
    <div id="view-map" class="view active">
      <div id="map"></div>
    </div>

    <div id="view-exhibitors" class="view">
      <h2>Aussteller</h2>
      <button id="favorites-toggle" class="filter-btn">☆ Nur Favoriten</button>
      <ul id="exhibitor-list-full"></ul>
    </div>

    <div id="view-program" class="view">
      <h2>Programm</h2>
      <ul id="program-list"></ul>
    </div>

    <div id="view-info" class="view">
      <h2 id="info-title">Info</h2>
      <p id="info-description" class="info-description" hidden></p>
      <p id="info-website" hidden><a id="info-website-link" href="#" target="_blank" rel="noopener">Zur Webseite ↗</a></p>
      <img id="info-header-image" alt="" hidden>
      <div id="info-gallery" class="info-gallery"></div>
    </div>

    <div id="view-exhibitor-detail" class="view">
      <button id="detail-back" class="back-btn">← Zurück</button>
      <img id="detail-image" class="detail-image" alt="" hidden>
      <div class="detail-header">
        <img id="detail-logo" class="detail-logo" alt="" hidden>
        <div>
          <h2 id="detail-name"></h2>
          <span id="detail-branche" class="detail-branche" hidden></span>
        </div>
      </div>
      <span id="detail-offer" class="offer-badge" hidden></span>
      <p id="detail-description" class="info-description" hidden></p>
      <div class="detail-contact">
        <button id="detail-show-map" class="show-map-btn">📍 Auf der Karte anzeigen</button>
        <a id="detail-website" href="#" target="_blank" rel="noopener" hidden>🌐 Webseite ↗</a>
        <a id="detail-phone" href="#" hidden></a>
      </div>
    </div>
  </main>

  <div id="offline-badge" hidden>Offline – Daten aus dem Cache</div>

  <nav id="bottom-nav">
    <button data-view="map" class="active"><span class="icon">🗺️</span><span>Karte</span></button>
    <button data-view="exhibitors"><span class="icon">📋</span><span>Aussteller</span></button>
    <button data-view="program"><span class="icon">📅</span><span>Programm</span></button>
    <button data-view="info"><span class="icon">ℹ️</span><span>Info</span></button>
  </nav>

  <script src="vendor/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
